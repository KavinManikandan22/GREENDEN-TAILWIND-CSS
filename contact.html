<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
</head>
<body>
    <!--Navbor Section-->
    <nav class="bg-green-400 p-4  flex text-center justify-between sticky top-0 shadow-2xl z-10" >
        <h1 class="text-3xl font-bold text-black">GREENDEN</h1>
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-7 w-7 h-7 md:hidden cursor-pointer">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
        </svg>
        <ul class="flex space-x-4 mt-2 hidden md:flex">
            <li>
                <a href="index.html" class="text-gray-600 hover:text-black hover:underline">Home</a>
            </li>
            <li>
                <a href="product.html" class="text-gray-600 hover:text-black hover:underline">Products</a>
            </li>
            <li>
                <a href="contact.html" class="text-gray-600 hover:text-black hover:underline">Contact</a>
            </li>
            <li>
                <a href="#" class="text-gray-600 hover:text-black hover:underline">About</a>
            </li>
        </ul>
    </nav>
    <!--Contact Form Section-->
    <section class="px-4 md:px-8 mt-6">
    <div class="max-w-xl mx-auto">
        <div class="mb-12">
            <h2 class="text-3xl font-bold text-slate-900 mb-6 md:text-4xl dark:text-slate-50 text-center p-6">Contact us</h2>
            <p class="text-base leading-relaxed text-slate-600 dark:text-slate-400">Have a question, need support, or want to discuss your next project? We’re here to help.</p>
        </div>

        <form class="space-y-6">
        <div>
            <label for="name"
               class="mb-2 text-slate-900 dark:text-slate-50 font-medium text-sm inline-block">Name</label>
            <input type="text" id="name" name="name" placeholder="Enter Your Name"
               class="px-3 py-2.5 text-sm text-slate-900 w-full rounded-md bg-white outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 dark:text-slate-50 dark:bg-neutral-800 dark:outline-neutral-700 border border-black" />
        </div>
        <div>
            <label for="email"
               class="mb-2 text-slate-900 dark:text-slate-50 font-medium text-sm inline-block">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your Email"
               class="px-3 py-2.5 text-sm text-slate-900 w-full rounded-md bg-white outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 dark:text-slate-50 dark:bg-neutral-800 dark:outline-neutral-700 border border-black" />
        </div>
        <div>
            <label for="phone" class="mb-2 text-slate-900 dark:text-slate-50 font-medium text-sm inline-block">Phone
               number</label>
            <input type="number" id="phone" name="phone" placeholder="Enter Your Mobile"
               class="px-3 py-2.5 text-sm text-slate-900 w-full rounded-md bg-white outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 dark:text-slate-50 dark:bg-neutral-800 dark:outline-neutral-700 border border-black" />
        </div>
        <div>
            <label for="message"
               class="mb-2 text-slate-900 dark:text-slate-50 font-medium text-sm inline-block">Message</label>
            <textarea placeholder="Write message" rows="6" type="text" id="message" name="message"
               class="px-3 py-2.5 text-sm text-slate-900 w-full rounded-md bg-white outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 dark:text-slate-50 dark:bg-neutral-800 dark:outline-neutral-700 border border-black"></textarea>
        </div>

            <button type="submit"class="py-2.5 px-4 text-sm rounded-md font-semibold cursor-pointer text-white border border-blue-600 bg-blue-600 hover:bg-blue-700 transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 ">Sendmessage</button>
        </form>
    </div>
    </section>
    <!--Footer Section-->
    <footer class="bg-green-400 text-black text-center p-6 mt-6">
        <h1 class="text-2xl font-bold mb-2">Greenden || Follow Us</h1>
        <h2 class="text-xl font-bold mb-2">Contact Us +91 98765 43210</h2>
        <p>&copy; 2024 Greenden. All rights reserved.</p>
    </footer>
</body>
</html>
